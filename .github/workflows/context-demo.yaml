name: Context variables Demo

on: push

jobs:
  context-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Use context variables
        run: |
          echo "This workflow was triggered by ${{github.actor}}"
          echo "The repository name is ${{ github.repository}}"
          echo "The branch name is ${{ github.ref_name}}"
      - name: print all variables under github
        run: |
          echo '${{ toJson(github) }}'

      - name: Print enviromental variables
        run: printenv